name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify journal, editorial input, cache and Word export without game files
        run: dotnet run --project Tests/CityPress.Tests.csproj -c Release -- --core-only
  ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UI/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix UI --no-audit --no-fund
      - name: Verify UI types and production build
        run: |
          npm run typecheck --prefix UI
          npm run build --prefix UI
      - name: Audit runtime dependencies
        run: npm audit --prefix UI --omit=dev
